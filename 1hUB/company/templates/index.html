<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Company Profile Verifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Colorful gradient background */
            background-color: #8EC5FC;
            background-image: linear-gradient(62deg, #8EC5FC 0%, #E0C3FC 100%);
            min-height: 100vh;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff; /* Make loader white for better contrast */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* "Glassmorphism" card effect */
        .card {
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.75rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937; /* Darker text for readability */
            margin-bottom: 1rem;
        }
        .sentiment-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600; /* Bolder font */
            text-transform: capitalize;
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="container mx-auto max-w-4xl px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight text-shadow">AI Company Profile Verifier</h1>
            <p class="text-lg text-gray-100 mt-2">Get AI powered, structured insights into any company.</p>
        </header>

        <main>
            <div class="bg-white/30 p-6 rounded-lg shadow-lg backdrop-blur-sm border border-white/20 mb-8">
                <form id="company-form" class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="company-name" class="flex-grow w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 transition placeholder-gray-500" placeholder="e.g., Mahat Labs" required>
                    <button type="submit" id="submit-btn" class="bg-gradient-to-r from-purple-600 to-pink-500 text-white font-semibold px-6 py-3 rounded-md hover:from-purple-700 hover:to-pink-600 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:ring-offset-2 transition duration-200 flex items-center justify-center gap-2 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9.09 9.91 1.63.54c.26.09.5.26.66.49l.54 1.63"/><path d="m14.91 14.09-1.63-.54c-.26-.09-.5-.26-.66-.49l-.54-1.63"/><path d="M2 12h2"/><path d="M12 2v2"/><path d="M20 12h2"/><path d="M12 20v2"/></svg>
                        <span>Verify Company</span>
                    </button>
                </form>
            </div>

            <div id="results-container" class="hidden">
                <div id="loader" class="loader mx-auto hidden my-8"></div>
                <div id="error-message" class="text-red-800 bg-red-200 border border-red-400 p-4 rounded-md hidden"></div>
                
                <div id="verification-results" class="space-y-6">
                    <div class="card">
                        <h3 class="card-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-600"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                            Official Website
                        </h3>
                        <a id="website-url" href="#" target="_blank" rel="noopener noreferrer" class="text-purple-700 hover:underline break-all text-lg font-semibold"></a>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div id="about-section" class="card md:col-span-2">
                           <h3 class="card-title">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-600"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                                About <span id="company-title" class="font-bold">Company</span>
                           </h3>
                           <p id="about-content" class="text-gray-700 leading-relaxed"></p>
                        </div>

                        <div id="services-section" class="card">
                               <h3 class="card-title">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-600"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                                    Services
                                 </h3>
                               <ul id="services-list" class="space-y-2 text-gray-700 list-disc list-inside"></ul>
                        </div>
                        
                        <div id="location-section" class="card">
                               <h3 class="card-title">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-600"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                    Location
                                 </h3>
                               <p id="location-content" class="text-gray-700 text-lg"></p>
                        </div>
                        
                        <div id="reviews-section" class="card md:col-span-2">
                            <h3 class="card-title">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-600"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                User Reviews Summary
                            </h3>
                           <div class="flex items-center gap-4 mb-3">
                                <span class="font-semibold text-gray-700">Overall Sentiment:</span>
                                <span id="sentiment-content" class="sentiment-badge"></span>
                           </div>
                           <p id="reviews-summary" class="text-gray-700 leading-relaxed"></p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- NO CHANGES NEEDED TO JAVASCRIPT ---
        const companyForm = document.getElementById('company-form');
        const submitBtn = document.getElementById('submit-btn');
        const resultsContainer = document.getElementById('results-container');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');
        const verificationResults = document.getElementById('verification-results');

        companyForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const companyName = document.getElementById('company-name').value;

            // --- Reset UI State ---
            resultsContainer.classList.remove('hidden');
            verificationResults.classList.add('hidden');
            errorMessage.classList.add('hidden');
            loader.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.querySelector('span').textContent = 'Analyzing...';

            try {
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ company_name: companyName }),
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'An unknown error occurred.');
                
                renderResults(data);
                verificationResults.classList.remove('hidden');

            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.querySelector('span').textContent = 'Verify Company';
            }
        });

        function renderResults(data) {
            const analysis = data.ai_analysis;

            document.getElementById('company-title').textContent = data.company_name || 'Company';

            const websiteUrlEl = document.getElementById('website-url');
            websiteUrlEl.href = data.website_url;
            websiteUrlEl.textContent = data.website_url;
            
            document.getElementById('about-content').textContent = analysis.about || 'N/A';
            
            document.getElementById('location-content').textContent = analysis.location || 'N/A';
            
            const servicesList = document.getElementById('services-list');
            servicesList.innerHTML = ''; 
            if (analysis.services && analysis.services.length > 0) {
                analysis.services.forEach(service => {
                    const li = document.createElement('li');
                    li.textContent = service;
                    servicesList.appendChild(li);
                });
            } else {
                servicesList.innerHTML = '<li>No services listed.</li>';
            }

            if (analysis.user_reviews) {
                const sentimentEl = document.getElementById('sentiment-content');
                if (analysis.user_reviews.sentiment && typeof analysis.user_reviews.sentiment === 'string') {
                    const sentiment = analysis.user_reviews.sentiment.toLowerCase();
                    sentimentEl.textContent = sentiment;
                    
                    sentimentEl.className = 'sentiment-badge'; 
                    if (sentiment === 'positive') {
                        sentimentEl.classList.add('bg-green-200', 'text-green-900');
                    } else if (sentiment === 'negative') {
                        sentimentEl.classList.add('bg-red-200', 'text-red-900');
                    } else { 
                        sentimentEl.classList.add('bg-yellow-200', 'text-yellow-900');
                    }
                } else {
                    sentimentEl.textContent = 'N/A';
                    sentimentEl.className = 'sentiment-badge bg-gray-200 text-gray-800';
                }

                document.getElementById('reviews-summary').textContent = analysis.user_reviews.summary || 'N/A';
            }
        }
    </script>
</body>
</html>
